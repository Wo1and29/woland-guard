[project]
name = "woland-guard-control-plane"
version = "0.1.0"
description = "Woland Guard control plane"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.15,<1.19",
    "fastapi>=0.115,<1",
    "httpx2>=2.9.1,<3",
    "jinja2>=3.1,<4",
    "psycopg[binary]>=3.3.4,<4",
    "pydantic-settings>=2.7,<3",
    "PyYAML>=6,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.52.1,<1",
    "woland-guard-contracts",
]

[project.scripts]
woland-guard-admin = "woland_guard_control_plane.cli:main"
woland-guard-demo = "woland_guard_control_plane.demo.cli:main"
woland-guard-outbox = "woland_guard_control_plane.outbox_cli:main"
woland-guard-telegram-bot = "woland_guard_control_plane.telegram_bot_cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"
