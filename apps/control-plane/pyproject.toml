[project]
name = "woland-guard-control-plane"
version = "0.1.0"
description = "Woland Guard control plane"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.15,<2",
    "fastapi>=0.115,<1",
    "httpx2>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "PyYAML>=6,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
    "woland-guard-contracts",
]

[project.scripts]
woland-guard-admin = "woland_guard_control_plane.cli:main"
woland-guard-outbox = "woland_guard_control_plane.outbox_cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"
