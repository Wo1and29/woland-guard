<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Woland Guard{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232c6e8e' d='M12 1.5l8 3v6.2c0 5.1-3.4 9.4-8 11.8-4.6-2.4-8-6.7-8-11.8V4.5l8-3z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ request.scope.root_path }}/static/dashboard.css">
</head>
<body class="{% block body_class %}minimal-page{% endblock %}">
  {% block lang_switch %}
  <nav class="lang-switch" aria-label="Language / Язык">
    <a{% if lang == 'ru' %} aria-current="true"{% endif %} href="{{ request.scope.root_path }}/lang/ru">RU</a>
    <a{% if lang == 'en' %} aria-current="true"{% endif %} href="{{ request.scope.root_path }}/lang/en">EN</a>
  </nav>
  {% endblock %}
  <main class="minimal-shell">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
