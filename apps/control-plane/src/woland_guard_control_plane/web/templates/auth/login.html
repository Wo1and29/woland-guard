{% extends "base_minimal.html" %}
{% block title %}Вход — Woland Guard{% endblock %}
{% block content %}
<h1>Вход оператора</h1>
<form method="post" action="/dashboard/login" accept-charset="UTF-8">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <label for="credential">API-ключ оператора</label>
  <input id="credential" name="credential" type="password" required autocomplete="off">
  <button type="submit">Войти</button>
</form>
{% endblock %}
