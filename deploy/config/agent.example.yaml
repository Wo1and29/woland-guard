schema_version: 1

# Exactly one source. On a systemd host journald already carries the sshd, sudo
# and useradd lines that /var/log/auth.log repeats, so enabling both would report
# every login attempt twice under different event ids and halve every detection
# threshold in practice. The schema refuses that combination (ADR-0019).
#
#   journald    - the default; reads the journal through /usr/bin/journalctl
#   syslog_file - for hosts without a readable journal; needs the section below
source: journald

# Required only when source is syslog_file, and rejected otherwise.
# The agent user needs read access to this file (group `adm` on Debian/Ubuntu).
# syslog_file:
#   path: /var/log/auth.log

# Independent of `source` above and safe to enable alongside it: an access log
# shares no record with the system journal, so there is nothing to double-count
# (ADR-0020). Only the nginx default `combined` format is parsed. The query
# string is dropped before an event is built and never leaves the host, and only
# a 4xx or 5xx response becomes an event at all.
# nginx_access:
#   path: /var/log/nginx/access.log

http:
  base_url: https://control-plane.example.invalid
  token_file: /etc/woland-guard/agent.token
  connect_timeout_seconds: 5
  read_timeout_seconds: 15
  batch_size: 100

spool:
  path: /var/lib/woland-guard/spool.sqlite3
  max_events: 10000

retry:
  base_seconds: 1
  maximum_seconds: 300
  authentication_seconds: 300

delivery_poll_seconds: 1
log_level: INFO
