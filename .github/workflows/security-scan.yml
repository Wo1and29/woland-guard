name: Security scan

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # New CVEs land against the same code every week even without a push.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-repo:
    name: Trivy — dependencies and IaC config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Two separate invocations, not one: trivy-action's SARIF output does
      # not consistently respect --ignorefile for its own exit-code decision
      # (confirmed by hand — the identical scan with format:table honors the
      # ignore list and exits 0, format:sarif does not and exits 1 on the
      # same, already-ignored findings). SARIF still needs uploading for the
      # Security tab, so it stays non-blocking (exit-code 0); a second,
      # non-SARIF run is the actual gate.
      - name: Run Trivy (filesystem + misconfig, SARIF for the Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          format: sarif
          output: trivy-repo.sarif
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-repo
      - name: Run Trivy (filesystem + misconfig, blocking gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          format: table
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml
          exit-code: "1"

  trivy-image:
    name: Trivy — runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build control-plane runtime image
        run: |
          docker build --target runtime \
            -f deploy/docker/control-plane.Dockerfile \
            -t woland-guard-control-plane:scan .
      - name: Run Trivy (image, SARIF for the Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: woland-guard-control-plane:scan
          scanners: vuln
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Run Trivy (image, blocking gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: woland-guard-control-plane:scan
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml
          exit-code: "1"

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: "/language:${{ matrix.language }}"
