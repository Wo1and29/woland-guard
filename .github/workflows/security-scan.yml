name: Security scan

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # New CVEs land against the same code every week even without a push.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-repo:
    name: Trivy — dependencies and IaC config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Trivy (filesystem + misconfig)
        id: trivy
        continue-on-error: true # upload SARIF below even when this finds something; the final step still fails the job
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          format: sarif
          output: trivy-repo.sarif
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-repo
      - name: Fail on unignored critical/high findings
        if: steps.trivy.outcome == 'failure'
        run: exit 1

  trivy-image:
    name: Trivy — runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build control-plane runtime image
        run: |
          docker build --target runtime \
            -f deploy/docker/control-plane.Dockerfile \
            -t woland-guard-control-plane:scan .
      - name: Run Trivy (image)
        id: trivy
        continue-on-error: true # upload SARIF below even when this finds something; the final step still fails the job
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: woland-guard-control-plane:scan
          scanners: vuln
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: DEBUG table output
        if: steps.trivy.outcome == 'failure'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: woland-guard-control-plane:scan
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml
          exit-code: "0"
      - name: Fail on unignored critical/high findings
        if: steps.trivy.outcome == 'failure'
        run: exit 1

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: "/language:${{ matrix.language }}"
