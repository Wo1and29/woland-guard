name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.11.30"
  UV_NO_PROGRESS: "1"
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Unit tests (PostgreSQL integration tests are skipped without Compose)
        run: uv run pytest

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WG_POSTGRES_PASSWORD: ci-ephemeral-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start PostgreSQL and control plane (migrations run automatically via the migrate service)
        run: docker compose up -d --wait postgres control-plane
      - name: Check for undetected model/migration drift
        run: docker compose exec -T control-plane alembic check
      - name: Run integration test suite against real PostgreSQL
        run: docker compose --profile test run --rm integration-tests
      - name: Tear down
        if: always()
        run: docker compose down -v

  docker-build:
    name: Build runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build control-plane runtime image (no push)
        run: |
          docker build --target runtime \
            -f deploy/docker/control-plane.Dockerfile \
            -t woland-guard-control-plane:ci .

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Export locked dependencies
        run: uv export --format requirements.txt --no-hashes --all-packages --no-dev -o requirements-audit.txt
      - name: Audit with pip-audit
        run: uvx "pip-audit==${{ env.PIP_AUDIT_VERSION }}" -r requirements-audit.txt

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
