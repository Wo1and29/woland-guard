[project]
name = "woland-guard-workspace"
version = "0.1.0"
description = "Workspace for the Woland Guard defensive Linux monitoring system"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.15,<2",
    "playwright==1.61.0",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "trustme==1.2.1",
    "types-PyYAML>=6.0.12,<7",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/agent", "apps/control-plane", "packages/contracts"]

[tool.uv.sources]
woland-guard-contracts = { workspace = true }

[tool.pytest.ini_options]
addopts = [
    "--cov=woland_guard_agent",
    "--strict-config",
    "--strict-markers",
    "--cov=woland_guard_control_plane",
    "--cov=woland_guard_contracts",
    "--cov-report=term-missing",
]
pythonpath = [".", "apps/agent/src", "apps/control-plane/src", "packages/contracts/src"]
testpaths = ["tests"]
markers = [
    "browser: requires explicit Chromium and an isolated HTTPS/PostgreSQL harness",
    "docker: requires the local Docker engine and an isolated Compose project",
    "e2e: requires explicit clean-install full-stack verification",
    "integration: requires the Docker integration environment",
]

[tool.coverage.run]
branch = true
source = ["woland_guard_agent", "woland_guard_control_plane", "woland_guard_contracts"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true

[tool.ruff]
line-length = 100
src = ["apps/agent/src", "apps/control-plane/src", "packages/contracts/src", "scripts", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["apps/agent/src", "apps/control-plane/src", "packages/contracts/src", "scripts", "tests"]
strict = true
warn_unreachable = true
pretty = true
