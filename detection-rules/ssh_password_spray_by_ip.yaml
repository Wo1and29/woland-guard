schema_version: 1
rule_key: ssh_password_spray_by_ip
version: 1
enabled: true
severity: high
title: Password spraying по SSH
description: Один адрес проверяет не менее пяти различных пользователей за десять минут.
explanation: Разные имена пользователей с одного источника могут указывать на password spraying.
recommendation: Проверьте источник, затронутые аккаунты и примените ограничение попыток входа.
mitre_attack_ids: [T1110.003]
condition:
  type: distinct_count
  event_type: linux.ssh.authentication_failed
  distinct_field: actor
  distinct_threshold: 5
  minimum_events: 5
  window_seconds: 600
  group_by: [source_ip]
correlation_fields: [source_ip]
