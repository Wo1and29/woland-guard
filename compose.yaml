name: woland-guard

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${WG_POSTGRES_DB:-woland_guard}
      POSTGRES_USER: ${WG_POSTGRES_USER:-woland_guard}
      POSTGRES_PASSWORD: ${WG_POSTGRES_PASSWORD:?Set WG_POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  control-plane:
    build:
      context: .
      dockerfile: deploy/docker/control-plane.Dockerfile
      target: runtime
    environment:
      WG_APP_ENV: ${WG_APP_ENV:-development}
      WG_POSTGRES_HOST: postgres
      WG_POSTGRES_PORT: 5432
      WG_POSTGRES_DB: ${WG_POSTGRES_DB:-woland_guard}
      WG_POSTGRES_USER: ${WG_POSTGRES_USER:-woland_guard}
      WG_POSTGRES_PASSWORD: ${WG_POSTGRES_PASSWORD:?Set WG_POSTGRES_PASSWORD in .env}
      WG_POSTGRES_CONNECT_TIMEOUT_SECONDS: ${WG_POSTGRES_CONNECT_TIMEOUT_SECONDS:-3}
      WG_INGEST_MAX_BODY_BYTES: ${WG_INGEST_MAX_BODY_BYTES:-1048576}
      WG_INGEST_RATE_LIMIT_REQUESTS: ${WG_INGEST_RATE_LIMIT_REQUESTS:-60}
      WG_INGEST_RATE_LIMIT_WINDOW_SECONDS: ${WG_INGEST_RATE_LIMIT_WINDOW_SECONDS:-60}
      WG_INGEST_MAX_CLOCK_SKEW_SECONDS: ${WG_INGEST_MAX_CLOCK_SKEW_SECONDS:-300}
      WG_OUTBOX_POLL_SECONDS: ${WG_OUTBOX_POLL_SECONDS:-2}
      WG_OUTBOX_LEASE_SECONDS: ${WG_OUTBOX_LEASE_SECONDS:-60}
      WG_OUTBOX_ADAPTER_TIMEOUT_SECONDS: ${WG_OUTBOX_ADAPTER_TIMEOUT_SECONDS:-30}
      WG_OUTBOX_RECOVERY_INTERVAL_SECONDS: ${WG_OUTBOX_RECOVERY_INTERVAL_SECONDS:-30}
      WG_OUTBOX_BACKOFF_BASE_SECONDS: ${WG_OUTBOX_BACKOFF_BASE_SECONDS:-5}
      WG_OUTBOX_BACKOFF_MAX_SECONDS: ${WG_OUTBOX_BACKOFF_MAX_SECONDS:-900}
      WG_OUTBOX_RETRY_AFTER_CAP_SECONDS: ${WG_OUTBOX_RETRY_AFTER_CAP_SECONDS:-3600}
      WG_OUTBOX_DEFAULT_MAX_ATTEMPTS: ${WG_OUTBOX_DEFAULT_MAX_ATTEMPTS:-5}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WG_HTTP_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  postgres-test-setup:
    profiles: ["test"]
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${WG_POSTGRES_USER:-woland_guard}
      POSTGRES_PASSWORD: ${WG_POSTGRES_PASSWORD:?Set WG_POSTGRES_PASSWORD in .env}
      TEST_DATABASE: ${WG_TEST_POSTGRES_DB:-woland_guard_test}
    command:
      - /bin/sh
      - -ec
      - |
        export PGPASSWORD="$${POSTGRES_PASSWORD}"
        case "$${TEST_DATABASE}" in
          *[!A-Za-z0-9_]*) echo "Unsafe test database name" >&2; exit 2 ;;
        esac
        if [ "$$(psql -h postgres -U "$${POSTGRES_USER}" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$${TEST_DATABASE}'")" != "1" ]; then
          createdb -h postgres -U "$${POSTGRES_USER}" "$${TEST_DATABASE}"
        fi
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  integration-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: deploy/docker/control-plane.Dockerfile
      target: test
    environment:
      WG_APP_ENV: test
      WG_POSTGRES_HOST: postgres
      WG_POSTGRES_PORT: 5432
      WG_POSTGRES_DB: ${WG_TEST_POSTGRES_DB:-woland_guard_test}
      WG_POSTGRES_USER: ${WG_POSTGRES_USER:-woland_guard}
      WG_POSTGRES_PASSWORD: ${WG_POSTGRES_PASSWORD:?Set WG_POSTGRES_PASSWORD in .env}
      WG_POSTGRES_CONNECT_TIMEOUT_SECONDS: ${WG_POSTGRES_CONNECT_TIMEOUT_SECONDS:-3}
      WG_INGEST_MAX_BODY_BYTES: ${WG_INGEST_MAX_BODY_BYTES:-1048576}
      WG_INGEST_RATE_LIMIT_REQUESTS: ${WG_INGEST_RATE_LIMIT_REQUESTS:-60}
      WG_INGEST_RATE_LIMIT_WINDOW_SECONDS: ${WG_INGEST_RATE_LIMIT_WINDOW_SECONDS:-60}
      WG_INGEST_MAX_CLOCK_SKEW_SECONDS: ${WG_INGEST_MAX_CLOCK_SKEW_SECONDS:-300}
      WG_OUTBOX_POLL_SECONDS: ${WG_OUTBOX_POLL_SECONDS:-2}
      WG_OUTBOX_LEASE_SECONDS: ${WG_OUTBOX_LEASE_SECONDS:-60}
      WG_OUTBOX_ADAPTER_TIMEOUT_SECONDS: ${WG_OUTBOX_ADAPTER_TIMEOUT_SECONDS:-30}
      WG_OUTBOX_RECOVERY_INTERVAL_SECONDS: ${WG_OUTBOX_RECOVERY_INTERVAL_SECONDS:-30}
      WG_OUTBOX_BACKOFF_BASE_SECONDS: ${WG_OUTBOX_BACKOFF_BASE_SECONDS:-5}
      WG_OUTBOX_BACKOFF_MAX_SECONDS: ${WG_OUTBOX_BACKOFF_MAX_SECONDS:-900}
      WG_OUTBOX_RETRY_AFTER_CAP_SECONDS: ${WG_OUTBOX_RETRY_AFTER_CAP_SECONDS:-3600}
      WG_OUTBOX_DEFAULT_MAX_ATTEMPTS: ${WG_OUTBOX_DEFAULT_MAX_ATTEMPTS:-5}
      WG_RUN_INTEGRATION_TESTS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-test-setup:
        condition: service_completed_successfully
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
