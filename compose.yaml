name: woland-guard

services:
  postgres:
    image: postgres:17-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
    environment:
      POSTGRES_DB: ${WG_POSTGRES_DB:-woland_guard}
      POSTGRES_USER: ${WG_POSTGRES_USER:-woland_guard}
      POSTGRES_PASSWORD: ${WG_POSTGRES_PASSWORD:?Set WG_POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/control-plane.Dockerfile
      target: runtime
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    user: "10001:10001"
    environment:
      WG_APP_ENV: ${WG_APP_ENV:-development}
      WG_POSTGRES_HOST: postgres
      WG_POSTGRES_PORT: 5432
      WG_POSTGRES_DB: ${WG_POSTGRES_DB:-woland_guard}
      WG_POSTGRES_USER: ${WG_POSTGRES_USER:-woland_guard}
      WG_POSTGRES_PASSWORD: ${WG_POSTGRES_PASSWORD:?Set WG_POSTGRES_PASSWORD in .env}
      WG_POSTGRES_CONNECT_TIMEOUT_SECONDS: ${WG_POSTGRES_CONNECT_TIMEOUT_SECONDS:-3}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  control-plane:
    build:
      context: .
      dockerfile: deploy/docker/control-plane.Dockerfile
      target: runtime
    environment:
      WG_APP_ENV: ${WG_APP_ENV:-development}
      WG_POSTGRES_HOST: postgres
      WG_POSTGRES_PORT: 5432
      WG_POSTGRES_DB: ${WG_POSTGRES_DB:-woland_guard}
      WG_POSTGRES_USER: ${WG_POSTGRES_USER:-woland_guard}
      WG_POSTGRES_PASSWORD: ${WG_POSTGRES_PASSWORD:?Set WG_POSTGRES_PASSWORD in .env}
      WG_POSTGRES_CONNECT_TIMEOUT_SECONDS: ${WG_POSTGRES_CONNECT_TIMEOUT_SECONDS:-3}
      WG_INGEST_MAX_BODY_BYTES: ${WG_INGEST_MAX_BODY_BYTES:-1048576}
      WG_INGEST_RATE_LIMIT_REQUESTS: ${WG_INGEST_RATE_LIMIT_REQUESTS:-60}
      WG_INGEST_RATE_LIMIT_WINDOW_SECONDS: ${WG_INGEST_RATE_LIMIT_WINDOW_SECONDS:-60}
      WG_INGEST_MAX_CLOCK_SKEW_SECONDS: ${WG_INGEST_MAX_CLOCK_SKEW_SECONDS:-300}
      WG_WEB_PUBLIC_ORIGIN: ${WG_WEB_PUBLIC_ORIGIN:-https://localhost:8000}
      WG_WEB_SESSION_IDLE_SECONDS: ${WG_WEB_SESSION_IDLE_SECONDS:-1800}
      WG_WEB_SESSION_ABSOLUTE_SECONDS: ${WG_WEB_SESSION_ABSOLUTE_SECONDS:-43200}
      WG_WEB_SESSION_TOUCH_INTERVAL_SECONDS: ${WG_WEB_SESSION_TOUCH_INTERVAL_SECONDS:-300}
      WG_WEB_MAX_FORM_BODY_BYTES: ${WG_WEB_MAX_FORM_BODY_BYTES:-16384}
      WG_WEB_LOGIN_GLOBAL_LIMIT: ${WG_WEB_LOGIN_GLOBAL_LIMIT:-60}
      WG_WEB_LOGIN_GLOBAL_WINDOW_SECONDS: ${WG_WEB_LOGIN_GLOBAL_WINDOW_SECONDS:-60}
      WG_WEB_LOGIN_SUBJECT_LIMIT: ${WG_WEB_LOGIN_SUBJECT_LIMIT:-5}
      WG_WEB_LOGIN_SUBJECT_WINDOW_SECONDS: ${WG_WEB_LOGIN_SUBJECT_WINDOW_SECONDS:-300}
      WG_WEB_LOGIN_MALFORMED_LIMIT: ${WG_WEB_LOGIN_MALFORMED_LIMIT:-10}
      WG_WEB_LOGIN_MALFORMED_WINDOW_SECONDS: ${WG_WEB_LOGIN_MALFORMED_WINDOW_SECONDS:-60}
      WG_WEB_LOGIN_MAX_SUBJECT_BUCKETS: ${WG_WEB_LOGIN_MAX_SUBJECT_BUCKETS:-4096}
      WG_OUTBOX_POLL_SECONDS: ${WG_OUTBOX_POLL_SECONDS:-2}
      WG_OUTBOX_LEASE_SECONDS: ${WG_OUTBOX_LEASE_SECONDS:-60}
      WG_OUTBOX_ADAPTER_TIMEOUT_SECONDS: ${WG_OUTBOX_ADAPTER_TIMEOUT_SECONDS:-30}
      WG_OUTBOX_RECOVERY_INTERVAL_SECONDS: ${WG_OUTBOX_RECOVERY_INTERVAL_SECONDS:-30}
      WG_OUTBOX_BACKOFF_BASE_SECONDS: ${WG_OUTBOX_BACKOFF_BASE_SECONDS:-5}
      WG_OUTBOX_BACKOFF_MAX_SECONDS: ${WG_OUTBOX_BACKOFF_MAX_SECONDS:-900}
      WG_OUTBOX_RETRY_AFTER_CAP_SECONDS: ${WG_OUTBOX_RETRY_AFTER_CAP_SECONDS:-3600}
      WG_OUTBOX_DEFAULT_MAX_ATTEMPTS: ${WG_OUTBOX_DEFAULT_MAX_ATTEMPTS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${WG_HTTP_BIND:-127.0.0.1}:${WG_HTTP_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  outbox-worker:
    profiles: ["telegram-notifications"]
    build:
      context: .
      dockerfile: deploy/docker/control-plane.Dockerfile
      target: runtime
    command: ["woland-guard-outbox", "run"]
    user: "10001:10001"
    environment:
      WG_APP_ENV: ${WG_APP_ENV:-development}
      WG_POSTGRES_HOST: postgres
      WG_POSTGRES_PORT: 5432
      WG_POSTGRES_DB: ${WG_POSTGRES_DB:-woland_guard}
      WG_POSTGRES_USER: ${WG_POSTGRES_USER:-woland_guard}
      WG_POSTGRES_PASSWORD: ${WG_POSTGRES_PASSWORD:?Set WG_POSTGRES_PASSWORD in .env}
      WG_POSTGRES_CONNECT_TIMEOUT_SECONDS: ${WG_POSTGRES_CONNECT_TIMEOUT_SECONDS:-3}
      WG_OUTBOX_POLL_SECONDS: ${WG_OUTBOX_POLL_SECONDS:-2}
      WG_OUTBOX_LEASE_SECONDS: ${WG_OUTBOX_LEASE_SECONDS:-60}
      WG_OUTBOX_ADAPTER_TIMEOUT_SECONDS: ${WG_OUTBOX_ADAPTER_TIMEOUT_SECONDS:-30}
      WG_OUTBOX_RECOVERY_INTERVAL_SECONDS: ${WG_OUTBOX_RECOVERY_INTERVAL_SECONDS:-30}
      WG_OUTBOX_BACKOFF_BASE_SECONDS: ${WG_OUTBOX_BACKOFF_BASE_SECONDS:-5}
      WG_OUTBOX_BACKOFF_MAX_SECONDS: ${WG_OUTBOX_BACKOFF_MAX_SECONDS:-900}
      WG_OUTBOX_RETRY_AFTER_CAP_SECONDS: ${WG_OUTBOX_RETRY_AFTER_CAP_SECONDS:-3600}
      WG_OUTBOX_DEFAULT_MAX_ATTEMPTS: ${WG_OUTBOX_DEFAULT_MAX_ATTEMPTS:-5}
      WG_TELEGRAM_CONNECT_TIMEOUT_SECONDS: ${WG_TELEGRAM_CONNECT_TIMEOUT_SECONDS:-5}
      WG_TELEGRAM_READ_TIMEOUT_SECONDS: ${WG_TELEGRAM_READ_TIMEOUT_SECONDS:-10}
      WG_TELEGRAM_WRITE_TIMEOUT_SECONDS: ${WG_TELEGRAM_WRITE_TIMEOUT_SECONDS:-5}
      WG_TELEGRAM_POOL_TIMEOUT_SECONDS: ${WG_TELEGRAM_POOL_TIMEOUT_SECONDS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${WG_TELEGRAM_STAGING_DIRECTORY:-./local-secrets/telegram}
        target: /run/woland-guard-staging/telegram
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /run/secrets/woland-guard/telegram:uid=10001,gid=10001,mode=0700
      - /tmp
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  telegram-bot:
    # Telegram rejects a second concurrent getUpdates consumer for the same bot token
    # with HTTP 409, so this service must stay at exactly one replica and must not be
    # combined with a configured webhook.
    profiles: ["telegram-notifications"]
    build:
      context: .
      dockerfile: deploy/docker/control-plane.Dockerfile
      target: runtime
    command:
      [
        "woland-guard-telegram-bot",
        "run",
        "--token-file-name",
        "${WG_TELEGRAM_BOT_TOKEN_FILE_NAME:-local-bot.token}",
      ]
    user: "10001:10001"
    environment:
      WG_APP_ENV: ${WG_APP_ENV:-development}
      WG_POSTGRES_HOST: postgres
      WG_POSTGRES_PORT: 5432
      WG_POSTGRES_DB: ${WG_POSTGRES_DB:-woland_guard}
      WG_POSTGRES_USER: ${WG_POSTGRES_USER:-woland_guard}
      WG_POSTGRES_PASSWORD: ${WG_POSTGRES_PASSWORD:?Set WG_POSTGRES_PASSWORD in .env}
      WG_POSTGRES_CONNECT_TIMEOUT_SECONDS: ${WG_POSTGRES_CONNECT_TIMEOUT_SECONDS:-3}
      WG_TELEGRAM_BOT_LONG_POLL_SECONDS: ${WG_TELEGRAM_BOT_LONG_POLL_SECONDS:-25}
      WG_TELEGRAM_BOT_CONNECT_TIMEOUT_SECONDS: ${WG_TELEGRAM_BOT_CONNECT_TIMEOUT_SECONDS:-5}
      WG_TELEGRAM_BOT_READ_TIMEOUT_SECONDS: ${WG_TELEGRAM_BOT_READ_TIMEOUT_SECONDS:-35}
      WG_TELEGRAM_BOT_WRITE_TIMEOUT_SECONDS: ${WG_TELEGRAM_BOT_WRITE_TIMEOUT_SECONDS:-5}
      WG_TELEGRAM_BOT_POOL_TIMEOUT_SECONDS: ${WG_TELEGRAM_BOT_POOL_TIMEOUT_SECONDS:-1}
      WG_TELEGRAM_BOT_REQUEST_TIMEOUT_SECONDS: ${WG_TELEGRAM_BOT_REQUEST_TIMEOUT_SECONDS:-60}
      WG_TELEGRAM_BOT_IDLE_POLL_SECONDS: ${WG_TELEGRAM_BOT_IDLE_POLL_SECONDS:-1}
      WG_TELEGRAM_BOT_BATCH_LIMIT: ${WG_TELEGRAM_BOT_BATCH_LIMIT:-25}
      WG_TELEGRAM_BOT_RESULT_LIMIT: ${WG_TELEGRAM_BOT_RESULT_LIMIT:-10}
      WG_TELEGRAM_BOT_RATE_LIMIT_REQUESTS: ${WG_TELEGRAM_BOT_RATE_LIMIT_REQUESTS:-20}
      WG_TELEGRAM_BOT_RATE_LIMIT_WINDOW_SECONDS: ${WG_TELEGRAM_BOT_RATE_LIMIT_WINDOW_SECONDS:-60}
      WG_TELEGRAM_BOT_PENDING_ACTION_TTL_SECONDS: ${WG_TELEGRAM_BOT_PENDING_ACTION_TTL_SECONDS:-300}
      WG_IP_BLOCK_ENABLED: ${WG_IP_BLOCK_ENABLED:-false}
      WG_IP_BLOCK_REQUIRE_SECOND_OPERATOR: ${WG_IP_BLOCK_REQUIRE_SECOND_OPERATOR:-true}
      WG_IP_BLOCK_PLAN_TTL_SECONDS: ${WG_IP_BLOCK_PLAN_TTL_SECONDS:-3600}
      WG_IP_BLOCK_NFT_TABLE: ${WG_IP_BLOCK_NFT_TABLE:-woland_guard}
      WG_IP_BLOCK_NFT_SET_V4: ${WG_IP_BLOCK_NFT_SET_V4:-blocked_v4}
      WG_IP_BLOCK_NFT_SET_V6: ${WG_IP_BLOCK_NFT_SET_V6:-blocked_v6}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${WG_TELEGRAM_STAGING_DIRECTORY:-./local-secrets/telegram}
        target: /run/woland-guard-staging/telegram
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /run/secrets/woland-guard/telegram:uid=10001,gid=10001,mode=0700
      - /tmp
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  telegram-admin:
    profiles: ["telegram-notifications"]
    build:
      context: .
      dockerfile: deploy/docker/control-plane.Dockerfile
      target: runtime
    command: ["woland-guard-admin", "list-notification-destinations"]
    user: "10001:10001"
    environment:
      WG_APP_ENV: ${WG_APP_ENV:-development}
      WG_POSTGRES_HOST: postgres
      WG_POSTGRES_PORT: 5432
      WG_POSTGRES_DB: ${WG_POSTGRES_DB:-woland_guard}
      WG_POSTGRES_USER: ${WG_POSTGRES_USER:-woland_guard}
      WG_POSTGRES_PASSWORD: ${WG_POSTGRES_PASSWORD:?Set WG_POSTGRES_PASSWORD in .env}
      WG_POSTGRES_CONNECT_TIMEOUT_SECONDS: ${WG_POSTGRES_CONNECT_TIMEOUT_SECONDS:-3}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${WG_TELEGRAM_STAGING_DIRECTORY:-./local-secrets/telegram}
        target: /run/woland-guard-staging/telegram
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp
    init: true
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  postgres-test-setup:
    profiles: ["test"]
    image: postgres:17-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
    environment:
      POSTGRES_USER: ${WG_POSTGRES_USER:-woland_guard}
      POSTGRES_PASSWORD: ${WG_POSTGRES_PASSWORD:?Set WG_POSTGRES_PASSWORD in .env}
      TEST_DATABASE: ${WG_TEST_POSTGRES_DB:-woland_guard_test}
    command:
      - /bin/sh
      - -ec
      - |
        export PGPASSWORD="$${POSTGRES_PASSWORD}"
        case "$${TEST_DATABASE}" in
          *[!A-Za-z0-9_]*) echo "Unsafe test database name" >&2; exit 2 ;;
        esac
        if [ "$$(psql -h postgres -U "$${POSTGRES_USER}" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$${TEST_DATABASE}'")" != "1" ]; then
          createdb -h postgres -U "$${POSTGRES_USER}" "$${TEST_DATABASE}"
        fi
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  integration-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: deploy/docker/control-plane.Dockerfile
      target: test
    environment:
      WG_APP_ENV: test
      WG_POSTGRES_HOST: postgres
      WG_POSTGRES_PORT: 5432
      WG_POSTGRES_DB: ${WG_TEST_POSTGRES_DB:-woland_guard_test}
      WG_POSTGRES_USER: ${WG_POSTGRES_USER:-woland_guard}
      WG_POSTGRES_PASSWORD: ${WG_POSTGRES_PASSWORD:?Set WG_POSTGRES_PASSWORD in .env}
      WG_POSTGRES_CONNECT_TIMEOUT_SECONDS: ${WG_POSTGRES_CONNECT_TIMEOUT_SECONDS:-3}
      WG_INGEST_MAX_BODY_BYTES: ${WG_INGEST_MAX_BODY_BYTES:-1048576}
      WG_INGEST_RATE_LIMIT_REQUESTS: ${WG_INGEST_RATE_LIMIT_REQUESTS:-60}
      WG_INGEST_RATE_LIMIT_WINDOW_SECONDS: ${WG_INGEST_RATE_LIMIT_WINDOW_SECONDS:-60}
      WG_INGEST_MAX_CLOCK_SKEW_SECONDS: ${WG_INGEST_MAX_CLOCK_SKEW_SECONDS:-300}
      WG_WEB_PUBLIC_ORIGIN: ${WG_WEB_PUBLIC_ORIGIN:-https://localhost:8000}
      WG_WEB_SESSION_IDLE_SECONDS: ${WG_WEB_SESSION_IDLE_SECONDS:-1800}
      WG_WEB_SESSION_ABSOLUTE_SECONDS: ${WG_WEB_SESSION_ABSOLUTE_SECONDS:-43200}
      WG_WEB_SESSION_TOUCH_INTERVAL_SECONDS: ${WG_WEB_SESSION_TOUCH_INTERVAL_SECONDS:-300}
      WG_WEB_MAX_FORM_BODY_BYTES: ${WG_WEB_MAX_FORM_BODY_BYTES:-16384}
      WG_WEB_LOGIN_GLOBAL_LIMIT: ${WG_WEB_LOGIN_GLOBAL_LIMIT:-60}
      WG_WEB_LOGIN_GLOBAL_WINDOW_SECONDS: ${WG_WEB_LOGIN_GLOBAL_WINDOW_SECONDS:-60}
      WG_WEB_LOGIN_SUBJECT_LIMIT: ${WG_WEB_LOGIN_SUBJECT_LIMIT:-5}
      WG_WEB_LOGIN_SUBJECT_WINDOW_SECONDS: ${WG_WEB_LOGIN_SUBJECT_WINDOW_SECONDS:-300}
      WG_WEB_LOGIN_MALFORMED_LIMIT: ${WG_WEB_LOGIN_MALFORMED_LIMIT:-10}
      WG_WEB_LOGIN_MALFORMED_WINDOW_SECONDS: ${WG_WEB_LOGIN_MALFORMED_WINDOW_SECONDS:-60}
      WG_WEB_LOGIN_MAX_SUBJECT_BUCKETS: ${WG_WEB_LOGIN_MAX_SUBJECT_BUCKETS:-4096}
      WG_OUTBOX_POLL_SECONDS: ${WG_OUTBOX_POLL_SECONDS:-2}
      WG_OUTBOX_LEASE_SECONDS: ${WG_OUTBOX_LEASE_SECONDS:-60}
      WG_OUTBOX_ADAPTER_TIMEOUT_SECONDS: ${WG_OUTBOX_ADAPTER_TIMEOUT_SECONDS:-30}
      WG_OUTBOX_RECOVERY_INTERVAL_SECONDS: ${WG_OUTBOX_RECOVERY_INTERVAL_SECONDS:-30}
      WG_OUTBOX_BACKOFF_BASE_SECONDS: ${WG_OUTBOX_BACKOFF_BASE_SECONDS:-5}
      WG_OUTBOX_BACKOFF_MAX_SECONDS: ${WG_OUTBOX_BACKOFF_MAX_SECONDS:-900}
      WG_OUTBOX_RETRY_AFTER_CAP_SECONDS: ${WG_OUTBOX_RETRY_AFTER_CAP_SECONDS:-3600}
      WG_OUTBOX_DEFAULT_MAX_ATTEMPTS: ${WG_OUTBOX_DEFAULT_MAX_ATTEMPTS:-5}
      WG_TELEGRAM_CONNECT_TIMEOUT_SECONDS: ${WG_TELEGRAM_CONNECT_TIMEOUT_SECONDS:-5}
      WG_TELEGRAM_READ_TIMEOUT_SECONDS: ${WG_TELEGRAM_READ_TIMEOUT_SECONDS:-10}
      WG_TELEGRAM_WRITE_TIMEOUT_SECONDS: ${WG_TELEGRAM_WRITE_TIMEOUT_SECONDS:-5}
      WG_TELEGRAM_POOL_TIMEOUT_SECONDS: ${WG_TELEGRAM_POOL_TIMEOUT_SECONDS:-1}
      WG_RUN_INTEGRATION_TESTS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-test-setup:
        condition: service_completed_successfully
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
